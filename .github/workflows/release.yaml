on:
  workflow_dispatch:

  push:
    # run only against tags
    tags:
      - '*'

permissions:
  contents: write

# Single-runner OSS goreleaser release: linux amd64+arm64 binaries, deb/rpm
# packages, archives, and checksums. Darwin artifacts need either a
# GoReleaser Pro key (the go-template original used Pro split/merge across
# linux+macOS runners) or a dedicated macOS pipeline; macOS users can
# `go install` in the meantime.
jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - run: git fetch --force --tags
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Install arm64 cross-compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu
      - uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
