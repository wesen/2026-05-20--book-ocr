version: 2
project_name: book-ocr

before:
  hooks:
    # You may remove this if you don't use go modules.
    - go mod tidy
    # you may remove this if you don't need go generate
    - go generate ./...
builds:
  - id: book-ocr-linux
    env:
      - CGO_ENABLED=1
      - CC_linux_amd64=gcc
      - CXX_linux_amd64=g++
      - CC_linux_arm64=aarch64-linux-gnu-gcc
      - CXX_linux_arm64=aarch64-linux-gnu-g++
      - 'CC={{ index .Env (print "CC_" .Os "_" .Arch) }}'
      - 'CXX={{ index .Env (print "CXX_" .Os "_" .Arch) }}'
    main: ./cmd/book-ocr
    binary: book-ocr
    goos:
      - linux
# I am not able to test windows at the time
#      - windows
    goarch:
      - amd64
      - arm64
# Darwin builds need CGO (go-sqlite3) and therefore a macOS runner or the
# GoReleaser Pro split/merge pipeline; disabled until one of those exists.
# macOS users: go install github.com/go-go-golems/book-ocr/cmd/book-ocr@latest
checksum:
  name_template: 'checksums.txt'
snapshot:
  version_template: "{{ incpatch .Version }}-next"
changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'

nfpms:
  -
    id: packages

    vendor: GO GO GOLEMS
    homepage: https://github.com/wesen/2026-05-20--book-ocr
    maintainer: Manuel Odendahl <wesen@ruinwesen.com>

    description: |-
      Workflow-backed structured OCR for scanned technical books:
      per-page structured JSON, deterministic Markdown, figure crops,
      validation reports, and review PDFs.

    license: MIT

    # Formats to be generated.
    formats:
      # - apk
      - deb
      - rpm

    # Version Release.
    release: 1

    # Section.
    section: default

    # Priority.
    priority: extra

    # Custom configuration applied only to the Deb packager.
    deb:
      # Lintian overrides
      lintian_overrides:
        - statically-linked-binary
        - changelog-file-missing-in-native-package

# modelines, feel free to remove those if you don't want/use them:
# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
# vim: set ts=2 sw=2 tw=0 fo=cnqoj
